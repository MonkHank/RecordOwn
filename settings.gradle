//用于 配置 Gradle 插件的 Maven 仓库,配置的是构建过程中,使用的仓库;比如agp仓库;
pluginManagement {
  repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://www.jitpack.io' }
    gradlePluginPortal()
    google()
    mavenCentral()
    // 配置HMS Core SDK的Maven仓地址。
    maven {url 'https://developer.huawei.com/repo/'}
  }
 /* dependencies {
